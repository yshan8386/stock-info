services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-18080}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      DB_SCHEMA: ${DB_SCHEMA:-trade}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5}
      MOCK_CLAUDE: ${MOCK_CLAUDE:-false}
      SCHEDULED_BRIEFING_ENABLED: ${SCHEDULED_BRIEFING_ENABLED:-false}
      TZ: Asia/Seoul
    networks:
      - supabase

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      DB_SCHEMA: ${DB_SCHEMA:-trade}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5}
      MOCK_CLAUDE: ${MOCK_CLAUDE:-false}
      SCHEDULED_BRIEFING_ENABLED: ${SCHEDULED_BRIEFING_ENABLED:-false}
      TZ: Asia/Seoul
    networks:
      - supabase

networks:
  supabase:
    external: true
    name: ${SUPABASE_DOCKER_NETWORK:-supabase_default}
